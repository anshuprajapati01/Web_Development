<!DOCTYPE html>
<html lang="en"> <!-- 'lang' specifies the language of the document (English) -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Attributes Practice</title>
</head>
<body>

    <!-- 1. Heading -->
    <h1 id="main-heading" title="Hovering reveals this tooltip!">HTML Attributes Practice Page</h1>

    <!-- 2. Paragraph -->
    <p class="intro-text">This is a standard paragraph styled with a class attribute.</p>

    <!-- 3. Link -->
    <p>
        <a href="https://developer.mozilla.org" target="_blank" title="Visit Mozilla Developer Network (MDN)">
            Learn more about HTML
        </a>
    </p>

    <!-- 4. Image -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/HTML5_logo_and_wordmark.svg/512px-HTML5_logo_and_wordmark.svg.png" 
         alt="The official orange HTML5 shield logo" 
         width="200">

    <!-- 5. Another element with multiple attributes -->
    <p id="special-note" class="highlight-text">This paragraph uses both an ID and a Class at the same time.</p>

    <hr>

    <!-- ⭐ Bonus Practice -->
    <div id="container" class="box" title="This is a container">
        <p>This text lives inside the bonus container element.</p>
    </div>

</body>
</html>
