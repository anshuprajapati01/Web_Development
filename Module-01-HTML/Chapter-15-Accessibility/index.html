<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Practice</title>
</head>

<body>

    <!-- Semantic HTML: header -->
    <header>
        <!-- 1. Proper headings -->
        <h1>Accessibility Practice</h1>

        <!-- Semantic HTML: nav -->
        <nav>
            <!-- 6. aria-label -->
            <button aria-label="Open menu">☰</button>

            <!-- 5. Link text -->
            <a href="https://www.google.com">Visit Google</a>
        </nav>
    </header>

    <!-- Semantic HTML: main -->
    <main>

        <!-- Semantic HTML: section -->
        <section>
            <!-- 1. Proper headings (h2) -->
            <h2>Media Content</h2>

            <!-- 1. Proper headings (h3) -->
            <h3>Images</h3>

            <!-- 2. Image alt (Meaningful text) -->
            <img src="laptop.jpg" alt="A laptop on a study desk">

            <!-- 2. Image alt (Decorative - empty alt tells screen readers to ignore it) -->
            <img src="decorative-divider.png" alt="">
        </section>

        <!-- Semantic HTML: section -->
        <section>
            <!-- 1. Proper headings (h2) -->
            <h2>User Login Form</h2>

            <form action="#">
                <!-- 3. Form labels -->
                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="user_email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password" name="user_password" required>
                </div>

                <!-- 4. Accessible button -->
                <button type="submit">Login</button>
            </form>
        </section>

    </main>

    <!-- Semantic HTML: footer -->
    <footer>
        <p>Built for Accessibility Practice</p>
    </footer>

</body>

</html>
